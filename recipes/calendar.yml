# Kalendarz lunchów — co Janusz przygotowuje na lunch w danym dniu (format: docs/FORMAT-PRZEPISU.md, punkt 13).
#
#   RRRR-MM-DD: slug-przepisu                                  ← data = dzień przygotowania lunchu
#   RRRR-MM-DD: { recipe: slug-przepisu, note: "notatka" }     ← z krótką notatką (opcjonalna)
#
# - slug = nazwa pliku przepisu z recipes/ bez .md (przepis musi istnieć),
# - jeden lunch na dzień (data tylko raz), daty w kolejności,
# - przeszłych wpisów nie usuwaj — to historia.
# Zły wpis (data, slug, powtórzona data, nieznane pole) nie psuje kalendarza: na iPadzie przy tym dniu jest „⚠ brak przepisu”,
# a na liście przepisów czerwona plakietka z opisem błędu.

