<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T2 — HTML + CSS</title>
<style>
  :root {
    --tlo: #fff8f0;
    --tekst: #1a1a1a;
    --akcent: #c44a1e;
    --ok: #1e7a34;
    --zle: #b00020;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 40px 32px;
    background: var(--tlo);
    color: var(--tekst);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 22px;
    line-height: 1.4;
  }
  h1 { font-size: 48px; margin: 0 0 8px; color: var(--akcent); }
  p.lead { margin: 0 0 32px; font-size: 26px; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; }
  td { padding: 12px 8px; border-bottom: 1px solid #e0d4c8; vertical-align: top; }
  td:first-child { width: 40%; font-weight: 600; }
  .ok { color: var(--ok); font-weight: 700; }
  .zle { color: var(--zle); font-weight: 700; }
  .ua { font-size: 16px; word-break: break-all; color: #555; }
</style>
</head>
<body>
<h1>T2: HTML + CSS (bez JS)</h1>
<p class="lead">Jeśli to widzisz w kolorach (pomarańczowy nagłówek, kremowe tło), docelowy CSS działa.</p>
<table>
  <tr><td>Wiersz testowy</td><td class="ok">zielony tekst = klasy CSS działają</td></tr>
  <tr><td>Drugi wiersz</td><td class="zle">czerwony tekst</td></tr>
</table>
<p><a href="/">← Strona główna</a> · <a href="/t1.html">T1</a> · <a href="/t3.html">T3</a></p>
</body>
</html>
