<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test pamięci">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>T4 — test pamięci</title>
<style>
  body {
    margin: 0;
    padding: 40px 32px;
    background: #fff8f0;
    color: #1a1a1a;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 24px;
    line-height: 1.4;
  }
  h1 { font-size: 44px; margin: 0 0 8px; color: #c44a1e; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; margin: 16px 0 24px; }
  td { padding: 12px 8px; border-bottom: 1px solid #e0d4c8; }
  td:first-child { width: 45%; font-weight: 600; }
  td.liczba { font-size: 40px; font-weight: 700; }
  button {
    font-size: 26px;
    min-height: 60px;
    padding: 0 24px;
    margin: 0 16px 16px 0;
    border: 0;
    border-radius: 10px;
    background: #c44a1e;
    color: #fff;
  }
  .info { font-size: 20px; color: #555; }
</style>
</head>
<body>
<h1>T4: TEST PAMIĘCI</h1>
<p class="info">Każde załadowanie strony dodaje 1 do każdego licznika. Liczniki zapisują się na trzy sposoby; sprawdzamy, który przetrwa zamknięcie aplikacji.</p>
<table>
  <tr><td>Tryb</td><td id="tryb">—</td></tr>
  <tr><td>localStorage</td><td id="ls" class="liczba">—</td></tr>
  <tr><td>Ciasteczko (1 rok)</td><td id="ck" class="liczba">—</td></tr>
  <tr><td>IndexedDB</td><td id="idb" class="liczba">—</td></tr>
  <tr><td>Ostatni zapis</td><td id="czas">—</td></tr>
</table>
<button type="button" id="przeladuj">Przeładuj stronę</button>
<button type="button" id="zeruj">Wyzeruj liczniki</button>
<p><a href="/">← Strona główna</a></p>
<script>
(function () {
  var KLUCZ = 'test-t4';

  function ustaw(id, tekst) { document.getElementById(id).textContent = tekst; }

  ustaw('tryb', window.navigator.standalone === true ? 'z ekranu początkowego' : 'karta Safari');
  ustaw('czas', new Date().toLocaleTimeString());

  // 1. localStorage
  try {
    var n = parseInt(localStorage.getItem(KLUCZ) || '0', 10) + 1;
    localStorage.setItem(KLUCZ, String(n));
    ustaw('ls', String(n));
  } catch (e) {
    ustaw('ls', 'błąd: ' + e.name);
  }

  // 2. Ciasteczko trwałe (max-age = rok)
  try {
    var m = document.cookie.match(new RegExp('(?:^|; )' + KLUCZ + '=(\\d+)'));
    var c = (m ? parseInt(m[1], 10) : 0) + 1;
    document.cookie = KLUCZ + '=' + c + '; max-age=31536000; path=/; secure';
    ustaw('ck', String(c));
  } catch (e) {
    ustaw('ck', 'błąd: ' + e.name);
  }

  // 3. IndexedDB
  try {
    var req = indexedDB.open('test-t4', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
    req.onerror = function () { ustaw('idb', 'błąd otwarcia'); };
    req.onsuccess = function () {
      var db = req.result;
      var tx = db.transaction('kv', 'readwrite');
      var store = tx.objectStore('kv');
      var get = store.get('licznik');
      get.onsuccess = function () {
        var v = (get.result || 0) + 1;
        store.put(v, 'licznik');
        tx.oncomplete = function () { ustaw('idb', String(v)); };
      };
      tx.onerror = function () { ustaw('idb', 'błąd zapisu'); };
    };
  } catch (e) {
    ustaw('idb', 'błąd: ' + e.name);
  }

  document.getElementById('przeladuj').addEventListener('click', function () {
    location.reload();
  });

  document.getElementById('zeruj').addEventListener('click', function () {
    try { localStorage.removeItem(KLUCZ); } catch (e) {}
    document.cookie = KLUCZ + '=; max-age=0; path=/; secure';
    try {
      var r = indexedDB.open('test-t4', 1);
      r.onsuccess = function () {
        var tx = r.result.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete('licznik');
        tx.oncomplete = function () { ustaw('ls', '0'); ustaw('ck', '0'); ustaw('idb', '0'); };
      };
    } catch (e) {}
  });
})();
</script>
</body>
</html>
