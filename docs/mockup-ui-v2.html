<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kuchnia — mockup UI v2</title>
<style>
/* Mockup v2 (runda 3) — spokojniejszy dashboard:
   jeden panel urządzenia (Strefa 1 | SYNC/MATCH | Strefa 2) + niski pasek timera; pod nim Składniki | Kroki.
   Neon tylko na panelu urządzenia i bieżącym kroku. Zdjęcie pod przyciskiem w nagłówku.
   Paleta: niebieski; Ninja = błękit, TM6 = fiolet; cyfry białe z poświatą.
   Safari 12: Grid OK (grid-gap), bez flex gap, aspect-ratio, clamp/min/max, :is/:where/:has, inset, conic-gradient, backdrop-filter. */

:root {
  --ink: #F1F4FF; --ink2: #AEB8D6; --muted: #7380A6; --dim: #4A5478;
  --blue: #4F8BFF; --violet: #9B5CFF; --cyan: #38BDF8; --pink: #F472B6;
  --glow-b: rgba(70,130,255,.55); --glow-v: rgba(155,92,255,.55); --glow-c: rgba(56,189,248,.55);
  --line: rgba(120,150,255,.16);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #1E2129; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
[data-s], [data-o], [data-l], [data-t], [data-act], [data-open], [data-step], button { cursor: pointer; }
button { font-family: inherit; }

/* ── pasek sterowania mockupem (tylko na komputerze; na iPadzie wszystkim steruje się z ekranu) ── */
#tools { padding: 10px 16px; color: #C9D1D9; font-size: 14px; }
#tools span { margin-right: 6px; opacity: .7; }
#tools button { font-size: 14px; padding: 6px 10px; margin: 0 4px 6px 0; border: 1px solid #555; background: #3A4048; color: #EEE; border-radius: 6px; }
#tools button.on { background: #4F8BFF; color: #fff; border-color: #4F8BFF; }
#tools .grp { display: inline-block; margin-right: 16px; }
body.real { background: #000; overflow: hidden; }
body.real #tools { display: none; }
#stage { position: relative; }
#device { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.6); -webkit-transform-origin: 0 0; transform-origin: 0 0; }
body.real #device { border-radius: 0; box-shadow: none; }

/* ── tło ── */
#app { position: relative; width: 100%; height: 100%; font-size: 20px; line-height: 1.35; overflow: hidden;
  background-color: #070A1A;
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.7) 0, rgba(255,255,255,0) 1.2px),
    radial-gradient(circle at 63% 7%, rgba(255,255,255,.6) 0, rgba(255,255,255,0) 1.2px),
    radial-gradient(circle at 82% 18%, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 1.1px),
    radial-gradient(circle at 92% 6%, rgba(255,255,255,.6) 0, rgba(255,255,255,0) 1.2px),
    radial-gradient(ellipse 75% 60% at 10% 0%, rgba(50,90,240,.45) 0%, rgba(50,90,240,0) 70%),
    radial-gradient(ellipse 60% 55% at 100% 25%, rgba(30,120,255,.32) 0%, rgba(30,120,255,0) 70%);
  display: -webkit-flex; display: flex; }
.mtn { position: absolute; left: 0; bottom: 0; width: 100%; height: 34%; opacity: .55; }

/* ── panele ── */
.pn { position: relative; background: rgba(13,19,42,.80); border: 1px solid rgba(110,150,255,.22); border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.pn.lit { border-color: rgba(90,190,255,.70); box-shadow: 0 0 0 1px rgba(56,189,248,.14), 0 0 26px rgba(56,150,255,.32), inset 0 1px 0 rgba(255,255,255,.09); }
.pn.lit-v { border-color: rgba(180,130,255,.70); box-shadow: 0 0 0 1px rgba(155,92,255,.14), 0 0 26px rgba(155,92,255,.32), inset 0 1px 0 rgba(255,255,255,.09); }
.ct { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 12px 18px 0; min-height: 56px; }
.ct .t { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ct .r { font-size: 14px; color: var(--muted); font-weight: 600; }
.ico { display: inline-block; vertical-align: middle; }
.icbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(120,150,255,.35); background: rgba(24,32,70,.6); color: var(--ink2); padding: 0;
  display: -webkit-inline-flex; display: inline-flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.icbtn.pr { color: #fff; border-color: rgba(170,210,255,.7); background: linear-gradient(135deg, #2F80FF 0%, #4F6BFF 100%); box-shadow: 0 0 16px var(--glow-b), inset 0 1px 0 rgba(255,255,255,.3); }
.icbtn + .icbtn { margin-left: 10px; }

/* ── szyna boczna ── */
.rail { position: relative; z-index: 2; -webkit-flex: 0 0 72px; flex: 0 0 72px; margin: 14px 0 14px 12px; padding: 12px 0; border-radius: 24px; text-align: center;
  background: rgba(13,19,42,.80); border: 1px solid rgba(110,150,255,.22);
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; }
.ri { width: 52px; height: 52px; border-radius: 16px; margin: 4px 0; color: var(--ink2); background: transparent; border: 0; padding: 0;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.ri.on { color: #fff; background: linear-gradient(135deg, #2F80FF 0%, #4F6BFF 100%); box-shadow: 0 0 16px var(--glow-b), inset 0 1px 0 rgba(255,255,255,.3); }
.ri.lang { -webkit-flex-direction: column; flex-direction: column; font-size: 15px; font-weight: 800; line-height: 1.2; color: var(--dim); }
.ri.lang b { color: #fff; text-shadow: 0 0 10px rgba(199,215,255,.8); }
.rail .sp { -webkit-flex: 1 1 auto; flex: 1 1 auto; }
.rail .ver { font-size: 10px; color: var(--dim); line-height: 1.3; }

/* ── część główna ── */
.main { position: relative; z-index: 2; -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.head { -webkit-flex: 0 0 auto; flex: 0 0 auto; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 16px 18px 12px 16px; }
.head .back { -webkit-flex: 0 0 52px; flex: 0 0 52px; width: 52px; height: 52px; border-radius: 26px; margin-right: 14px; }
.head .hl { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
.head h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head h1.big { font-size: 42px; }
.head h1 em { font-style: normal; color: #7FB2FF; background: linear-gradient(90deg, #7FB2FF, #4FD1FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.head .sub { margin-top: 6px; font-size: 17px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photobtn { -webkit-flex: 0 0 auto; flex: 0 0 auto; height: 52px; padding: 0 18px; margin-left: 14px; border-radius: 26px; border: 1px solid rgba(120,150,255,.35); background: rgba(24,32,70,.7); color: #fff; font-size: 17px; font-weight: 600;
  display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.photobtn .ico { margin-right: 8px; color: #8EC5FF; }
.thumb { -webkit-flex: 0 0 84px; flex: 0 0 84px; width: 84px; height: 58px; margin-left: 14px; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(150,180,255,.45); }
.thumb .ph { width: 100%; height: 100%; border-radius: 0; }
.thumb .ex { position: absolute; right: 4px; bottom: 4px; width: 22px; height: 22px; border-radius: 11px; background: rgba(5,8,20,.7); color: #fff; text-align: center; line-height: 22px; }
.clock { -webkit-flex: 0 0 auto; flex: 0 0 auto; text-align: right; padding-left: 18px; }
.clock b { display: block; font-size: 44px; font-weight: 100; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(199,215,255,.4); }
.clock span { font-size: 14px; color: var(--ink2); }
.clock.big b { font-size: 58px; }
.clock.big span { font-size: 15px; }

.pin { -webkit-flex: 0 0 auto; flex: 0 0 auto; padding: 0 18px 14px 16px; }
.scroll { -webkit-flex: 1 1 auto; flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 18px 24px 16px; }
.body2 { display: grid; grid-template-columns: 340px minmax(0,1fr); grid-gap: 14px; -webkit-align-items: start; align-items: start; }
.portrait .body2 { grid-template-columns: minmax(0,1fr); }

/* ── panel Ninja: Strefa 1 | SYNC/MATCH | Strefa 2 ── */
.zrow { display: grid; grid-template-columns: minmax(0,1fr) 104px minmax(0,1fr); }
.zone { padding: 14px 20px 16px; }
.zh { font-size: 13px; letter-spacing: .16em; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.zh .no { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 12px; margin-right: 10px; font-size: 13px; letter-spacing: 0; color: #04131F; background: var(--cyan); box-shadow: 0 0 10px var(--glow-c); }
.zone .lbl { font-size: 23px; font-weight: 650; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone .lbl .fn { font-size: 14px; font-weight: 800; letter-spacing: .14em; color: #8EDBFF; margin-left: 10px; text-transform: uppercase; }
.digits { white-space: nowrap; margin-top: 2px; }
.dg { font-size: 60px; font-weight: 200; letter-spacing: -.02em; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px var(--glow-c); line-height: 1.05; }
.du { font-size: 19px; color: #8EDBFF; margin: 0 16px 0 3px; }
.portrait .dg { font-size: 48px; }
.portrait .du { margin-right: 10px; }
.portrait .zone { padding: 14px 14px 14px; }
.portrait .zone .lbl .fn { display: block; margin: 2px 0 0; }
.portrait .photobtn { width: 52px; padding: 0; -webkit-justify-content: center; justify-content: center; }
.portrait .photobtn .ico { margin: 0; }
.portrait .photobtn .lb { display: none; }
.portrait .clock b { font-size: 36px; }
.portrait .clock span { display: none; }
.turn { margin-top: 6px; font-size: 14px; font-weight: 800; letter-spacing: .08em; color: #C7D7FF; text-transform: uppercase; }
.turn.ok { color: var(--dim); }
.mode { border-left: 1px solid var(--line); border-right: 1px solid var(--line); margin: 16px 0;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.pill { display: block; width: 76px; text-align: center; height: 32px; line-height: 30px; border-radius: 16px; font-size: 12px; font-weight: 800; letter-spacing: .12em; border: 1px solid rgba(120,150,255,.28); color: var(--dim); margin: 5px 0; }
.pill.on { color: #fff; border-color: rgba(170,210,255,.7); background: linear-gradient(135deg, #2F80FF 0%, #4F6BFF 100%); box-shadow: 0 0 14px var(--glow-b); }

/* ── pasek timera ── */
.strip { border-top: 1px solid var(--line); padding: 10px 20px 12px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.strip .sr { -webkit-flex: 0 0 60px; flex: 0 0 60px; height: 60px; margin-right: 16px; }
.strip .sc { -webkit-flex: 0 0 auto; flex: 0 0 auto; margin-right: 22px; min-width: 120px; }
.strip .act { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: #8EC5FF; text-transform: uppercase; }
.strip .big { font-size: 40px; font-weight: 200; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 16px rgba(90,160,255,.8); line-height: 1.05; }
.strip .big.dash { color: var(--dim); text-shadow: none; }
.strip .si { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
.strip .w { font-size: 19px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .nx { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .sb { -webkit-flex: 0 0 auto; flex: 0 0 auto; margin-left: 12px; }
.strip .icbtn { width: 52px; height: 52px; border-radius: 26px; }

/* ── panel TM6 ── */
.tm6h { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 14px 20px 0; }
.tm6h .tag { font-size: 12px; font-weight: 800; letter-spacing: .14em; padding: 5px 10px; border-radius: 8px; color: #fff; background: var(--violet); box-shadow: 0 0 12px var(--glow-v); margin-right: 12px; }
.tm6h .st { -webkit-flex: 1 1 auto; flex: 1 1 auto; font-size: 16px; color: var(--ink2); }
.tm6h .st b { color: #fff; }
.tm6h .md { font-size: 15px; font-weight: 700; color: #D8C2FF; }
.dials { text-align: center; white-space: nowrap; padding: 8px 10px 14px; }
.dial { display: inline-block; width: 32%; vertical-align: top; position: relative; }
.dial svg { display: block; margin: 0 auto; }
.dial .c { position: absolute; left: 0; right: 0; top: 0; height: 124px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.dial .v { font-size: 30px; font-weight: 200; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px var(--glow-v); line-height: 1; }
.dial .v.sm { font-size: 22px; font-weight: 600; }
.dial .u { font-size: 12px; color: #D8C2FF; margin-top: 5px; letter-spacing: .06em; }
.dial .dl { font-size: 13px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
.dial.off .v { color: var(--dim); text-shadow: none; }

/* ── składniki ── */
.stepper { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.stepper .n { width: 88px; text-align: center; line-height: 1; }
.stepper .n b { display: block; font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(199,215,255,.5); }
.stepper .n span { font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.stepper .icbtn { color: #fff; font-size: 24px; font-weight: 300; }
.ingb { padding: 4px 18px 12px; }
.ingb .g { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #6FA8FF; margin: 12px 0 2px; }
.irow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(120,150,255,.10); }
.irow:last-child { border-bottom: 0; }
.irow .dot { -webkit-flex: 0 0 8px; flex: 0 0 8px; height: 8px; border-radius: 4px; margin-right: 14px; background: #6FA8FF; box-shadow: 0 0 6px rgba(80,150,255,.6); }
.irow .nm { -webkit-flex: 1 1 auto; flex: 1 1 auto; }
.irow .q { -webkit-flex: 0 0 auto; flex: 0 0 auto; padding-left: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.irow .q .u { color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 3px; }
.irow .q.none { color: var(--dim); }

/* ── kroki ── */
.stb { padding: 2px 14px 14px; }
.srow { display: -webkit-flex; display: flex; -webkit-align-items: stretch; align-items: stretch; padding: 12px 12px; margin-top: 10px; border-radius: 14px; background: rgba(6,10,26,.55); border: 1px solid rgba(120,150,255,.12); }
.srow .sn { -webkit-flex: 0 0 46px; flex: 0 0 46px; font-size: 17px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.srow .bar { -webkit-flex: 0 0 4px; flex: 0 0 4px; border-radius: 2px; margin-right: 14px; background: #4F8BFF; }
.srow .bar.cy { background: var(--cyan); box-shadow: 0 0 8px var(--glow-c); }
.srow .bar.vi { background: var(--violet); box-shadow: 0 0 8px var(--glow-v); }
.srow .bar.pk { background: var(--pink); box-shadow: 0 0 8px rgba(244,114,182,.6); }
.srow .bar.bl { background: var(--blue); box-shadow: 0 0 8px var(--glow-b); }
.srow .tx { -webkit-flex: 1 1 auto; flex: 1 1 auto; font-size: 20px; line-height: 1.4; color: var(--ink2); }
.srow.cur { background: rgba(40,56,130,.45); border-color: rgba(150,175,255,.75); box-shadow: 0 0 0 1px rgba(91,140,255,.3), 0 0 26px var(--glow-b), inset 0 1px 0 rgba(255,255,255,.1); }
.srow.cur .sn { color: #fff; text-shadow: 0 0 10px rgba(199,215,255,.8); }
.srow.cur .tx { color: #fff; }
.srow.past { opacity: .45; }
.chipsm { display: inline-block; margin: 8px 8px 0 0; height: 32px; line-height: 30px; padding: 0 12px; border-radius: 16px; font-size: 15px; font-weight: 700; border: 1px solid; font-variant-numeric: tabular-nums; }
.chipsm.tm { color: #E9D5FF; border-color: rgba(155,92,255,.65); background: rgba(155,92,255,.12); }
.chipsm.tin { color: #FBCFE8; border-color: rgba(244,114,182,.65); background: rgba(244,114,182,.12); }

/* ── zdjęcia (atrapy) ── */
.ph { position: relative; overflow: hidden; text-align: center; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.ph .em { position: absolute; left: 0; right: 0; top: 50%; margin-top: -.62em; line-height: 1.24em; }
.ph.none { background: rgba(6,10,26,.6); }
.ph.none .em { opacity: .35; }

/* ── lista ── */
.search { margin-bottom: 14px; height: 60px; padding: 0 22px; border-radius: 30px; font-size: 19px; color: var(--muted); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.search .ico { margin-right: 14px; color: #C7D7FF; }
.chips { white-space: nowrap; overflow: hidden; margin-bottom: 14px; }
.chip { display: inline-block; height: 44px; line-height: 42px; padding: 0 18px; margin-right: 10px; border-radius: 22px; font-size: 17px; color: var(--ink2); background: rgba(13,19,42,.80); border: 1px solid rgba(110,150,255,.25); }
.chip.on { color: #fff; border-color: rgba(170,210,255,.7); background: linear-gradient(135deg, #2F80FF 0%, #4F6BFF 100%); box-shadow: 0 0 16px var(--glow-b); }
.led { display: inline-block; width: 9px; height: 9px; border-radius: 5px; vertical-align: middle; position: relative; top: -1px; margin-right: 8px; }
.led.ninja { background: var(--cyan); box-shadow: 0 0 8px var(--glow-c); }
.led.tm6 { background: var(--violet); box-shadow: 0 0 8px var(--glow-v); }
.resume { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 14px 18px; margin-bottom: 14px; }
.resume .rm { -webkit-flex: 0 0 64px; flex: 0 0 64px; height: 64px; margin-right: 18px; position: relative; }
.resume .rm .ic { position: absolute; left: 0; top: 0; width: 64px; line-height: 64px; text-align: center; font-size: 15px; font-weight: 700; color: #fff; }
.resume .t { -webkit-flex: 1 1 auto; flex: 1 1 auto; }
.resume .k { font-size: 12px; letter-spacing: .16em; font-weight: 800; color: #8EDBFF; text-transform: uppercase; }
.resume .n { font-size: 22px; font-weight: 650; }
.resume .s { font-size: 16px; color: var(--ink2); }
.resume .s b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px var(--glow-c); }
.tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 14px; }
.portrait .tiles { grid-template-columns: 1fr 1fr; }
.tile { padding: 10px; }
.tile .ph { height: 132px; }
.tile h3 { margin: 12px 6px 4px; font-size: 19px; line-height: 1.25; font-weight: 650; height: 48px; overflow: hidden; }
.tile .meta { margin: 0 6px 4px; font-size: 15px; color: var(--muted); }
.tile .meta .led { margin-right: 5px; }
.tile .meta .d { margin-right: 12px; }

/* ── alarm ── */
#alarm { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 20; background-color: rgba(5,6,18,.96);
  background-image: radial-gradient(ellipse 60% 50% at 50% 42%, rgba(40,120,255,.35) 0%, rgba(40,120,255,0) 70%);
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; }
#alarm .halo { position: relative; width: 320px; height: 320px; -webkit-animation: pulse 1.2s ease-in-out infinite; animation: pulse 1.2s ease-in-out infinite; }
#alarm .halo .c { position: absolute; left: 0; top: 0; width: 320px; height: 320px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
@-webkit-keyframes pulse { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.04); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
#alarm .a1 { font-size: 50px; font-weight: 800; color: #fff; text-shadow: 0 0 24px var(--glow-b); line-height: 1.05; }
#alarm .a2 { font-size: 15px; letter-spacing: .18em; color: #C7D7FF; text-transform: uppercase; margin-top: 12px; }
#alarm .zn { margin-top: 26px; font-size: 26px; font-weight: 650; padding: 12px 24px; display: inline-block; }

    : '<button class="photobtn" data-act="photo">' + ic("image", 22) + '<span class="lb">' + L().photo + '</span></button>';
  var h = '<div class="head"><button class="icbtn back" data-act="back">' + ic("back", 26) + '</button><div class="hl"><h1>' + esc(tx(r)) + '</h1>' +
    '<div class="sub">' + L().prep + ' ' + r.prep + ' min · ' + L().cook + ' ' + r.cook + ' min</div></div>' + pbtn + clock(false) + '</div>';
  h += '<div class="pin" id="pin">' + (r.ninja ? ninjaPanel(r) : tm6Panel(r, cur)) + '</div>';

  var ing = '<div class="pn"><div class="ct"><span class="t">' + L().ing + '</span><div class="stepper"><button class="icbtn" data-act="serv-">−</button><div class="n"><b>' + sv + '</b><span>' + L().serv(sv) + '</span></div><button class="icbtn" data-act="serv+">+</button></div></div><div class="ingb">', g = null;
  for (i = 0; i < r.ing.length; i++) {
    var x = r.ing[i], gn = x.g ? tx({ pl: x.g[0], en: x.g[1] }) : null;
    if (gn !== g) { g = gn; if (g) ing += '<div class="g">' + esc(g) + '</div>'; }
    var q = x.a ? (Math.round(parseFloat(x.a) * f * 2) / 2) : null;
    ing += '<div class="irow"><div class="dot"></div><div class="nm">' + esc(tx(x)) + '</div><div class="q' + (x.a ? '' : ' none') + '">' + (x.a ? q + '<span class="u">' + x.u + '</span>' : '—') + '</div></div>';
  }
  ing += '</div></div>';
  var stc = '<div class="pn"><div class="ct"><span class="t">' + L().steps + '</span><span class="r" id="stepcnt">' + L().step + ' ' + (cur + 1) + ' ' + L().of + ' ' + r.steps.length + '</span></div><div class="stb">' + stepRows(r, cur) + '</div></div>';
  h += '<div class="scroll"><div class="body2">' + ing + stc + '</div></div>';
  return h;
}

function alarmView() {
  return '<div id="alarm"><div class="halo">' + ring(320, 1, "#7DD3FC", "#2F6BFF", "rgba(60,140,255,.95)", 12) +
    '<div class="c"><div class="a1">' + L().flipNow.toUpperCase().replace(" ", "<br>") + '</div><div class="a2">Ninja</div></div></div>' +
    '<div><div class="zn pn lit"><span class="no">1</span>' + L().zone + ' 1 · ' + (S.lang === "pl" ? "Udka" : "Thighs") + '</div></div><button class="done" data-act="t-done">' + L().done + '</button></div>';
}

function render() {
  var app = document.getElementById("app");
  var main = S.screen === "list" ? listView() : recipeView(S.screen);
  var h = mountains() + rail() + '<div class="main">' + main + '</div>';
  if (S.screen === "udka" && S.timer === "alarm") h += alarmView();
  if (S.photo && R[S.screen]) h += '<div id="viewer" data-act="close"><div class="vbar"><h1>' + esc(tx(R[S.screen])) + '</h1><button class="icbtn" style="width:auto;padding:0 18px;color:#fff">✕ ' + L().close + '</button></div>' + photo(R[S.screen].ph, "big", 220) + '</div>';
  var old = app.querySelector(".scroll"), keep = (old && render.last === S.screen) ? old.scrollTop : 0;
  app.innerHTML = h;
  var sc = app.querySelector(".scroll"); if (sc) sc.scrollTop = keep;
  render.last = S.screen;
  app.className = S.orient === "port" ? "portrait" : "landscape";
  document.documentElement.lang = S.lang;
  fit();
}

function fit() {
  var d = document.getElementById("device");
  if (REAL) {
    var o = window.innerWidth > window.innerHeight ? "land" : "port";
    if (o !== S.orient) { S.orient = o; render(); return; }
    d.style.width = window.innerWidth + "px"; d.style.height = window.innerHeight + "px"; d.style.left = "0";
    d.style.webkitTransform = "none"; d.style.transform = "none";
    document.getElementById("stage").style.height = window.innerHeight + "px";
    return;
  }
  var w = S.orient === "land" ? 1024 : 768, hh = S.orient === "land" ? 768 : 1024;
  var top = document.getElementById("tools").offsetHeight;
  var sc = Math.min(1, (window.innerWidth - 32) / w, (window.innerHeight - top - 16) / hh);
  d.style.width = w + "px"; d.style.height = hh + "px"; d.style.left = "16px";
  d.style.webkitTransform = "scale(" + sc + ")"; d.style.transform = "scale(" + sc + ")";
  document.getElementById("stage").style.height = Math.ceil(hh * sc + 16) + "px";
}

function mark(attr, val) {
  var b = document.querySelectorAll("#tools button[" + attr + "]");
  for (var i = 0; i < b.length; i++) b[i].className = b[i].getAttribute(attr) === val ? "on" : "";
}
function setTimer(st) { S.timer = st; mark("data-t", st); render(); }
function setStep(n) {
  S.cur[S.screen] = n;
  var r = R[S.screen];
  document.querySelector("#app .stb").innerHTML = stepRows(r, n);
  document.getElementById("stepcnt").innerHTML = L().step + ' ' + (n + 1) + ' ' + L().of + ' ' + r.steps.length;
  if (!r.ninja) document.getElementById("pin").innerHTML = tm6Panel(r, n);
}

document.addEventListener("click", function (e) {
  var t = e.target;
  while (t && t !== document) {
    if (t.getAttribute) {
      var a = t.getAttribute("data-act");
      if (t.getAttribute("data-s")) { S.photo = false; S.screen = t.getAttribute("data-s"); mark("data-s", S.screen); render(); return; }
      if (t.getAttribute("data-t")) { if (S.screen !== "udka") { S.screen = "udka"; mark("data-s", "udka"); } setTimer(t.getAttribute("data-t")); return; }
      if (t.getAttribute("data-l")) { S.lang = t.getAttribute("data-l"); mark("data-l", S.lang); render(); return; }
      if (t.getAttribute("data-o")) { S.orient = t.getAttribute("data-o"); mark("data-o", S.orient); render(); return; }
      /* timer w mockupie: ▶ start, tapnięcie licznika = „czas minął” (alarm), Zrobione, ↺ reset */
      if (a === "t-run") { setTimer("run"); return; }
      if (a === "t-reset") { setTimer("idle"); return; }
      if (a === "t-skip") { if (S.timer === "run") setTimer("alarm"); return; }
      if (a === "t-done") { setTimer("after"); return; }
      if (a === "lang") { S.lang = S.lang === "pl" ? "en" : "pl"; mark("data-l", S.lang); render(); return; }
      if (a === "back") { S.photo = false; S.screen = "list"; mark("data-s", "list"); render(); return; }
      if (a === "photo") { S.photo = true; render(); return; }
      if (a === "close") { S.photo = false; render(); return; }
      if (a === "serv-" || a === "serv+") { var r = R[S.screen], v = S.serv[S.screen] || r.serv; S.serv[S.screen] = Math.max(1, Math.min(12, v + (a === "serv+" ? 1 : -1))); render(); return; }
      if (t.getAttribute("data-open")) { S.photo = false; S.screen = t.getAttribute("data-open"); mark("data-s", S.screen); render(); return; }
      if (t.getAttribute("data-step")) { setStep(+t.getAttribute("data-step")); return; }
    }
    t = t.parentNode;
  }
});
window.addEventListener("resize", fit);
render();
</script>
</body>
</html>
